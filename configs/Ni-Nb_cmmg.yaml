# configs/Ni-Nb_cmmg.yaml
# hull0k system config for Ni-Nb, CLUSTER-FACING (cmmg module lammps/250722, launched with srun), same pattern as
# configs/Ni-Cu_cmmg-NIST.yaml: `prepare` bakes lmp command + potential paths into every job.json; data_tree stays the
# Mac path (prepare / harvest / hull / report run on the Mac side, only run_one.py runs on cmmg).
# Author: Erik Bitzek (created with LLM-LAMMPS)  Date: 2026-10-07
#
# NEW KEY reference_lattice (hull0k change of 2026-10-07): Nb is bcc, so formation and defect energies are referenced
# to bcc Nb (and fcc Ni). Without the key hull0k uses fcc for both elements, as before (Ni-Cu unchanged).
# Pool recipe (two SQS parents, two defect hosts): 00_STRUCTURE-POOL/build-pool_Ni-Nb.sh

system: Ni-Nb
elements: [Ni, Nb]          # type 1 = Ni, type 2 = Nb -- fixed globally; x = x_Nb
masses: [58.6934, 92.90637]
reference_lattice: {Ni: fcc, Nb: bcc}

# initial guesses (A) for structure building only; Nb: fcc-equivalent of bcc a = 3.30 A (same atomic volume)
a_fcc: {Ni: 3.52, Nb: 4.158}

data_tree: /Users/e.bitzek/Desktop/SIMULATIONS/CONVEX-HULL-0K-Ni-Nb
pool_dir: 00_STRUCTURE-POOL

potentials:
  ACE-NiNb:
    thread_dir: 01_HULL-ACE-NiNb
    file: /cmmc/ptmp/biterik/POTENTIALS/ace_NiNb.yaml
