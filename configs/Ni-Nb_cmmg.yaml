lmp_binary: lmp                    # cmmg module lammps/250722 (MPI-only build), on PATH inside the job
lmp_version: "22 Jul 2025 - Update 3 (cmmg module lammps/250722)"
lmp_launch: "srun"

sqs:                                 # fcc set; the bcc set is built by build-pool_Ni-Nb.sh with parent: bcc
  parent: fcc
  compositions: [0.25, 0.50, 0.75]   # x_Nb
  natoms: 108
  cutoffs: [8.0, 5.0]
  n_steps: 50000

defects:                             # Ni host (fcc 4x4x4); the Nb host (bcc 5x5x5) is built by build-pool_Ni-Nb.sh
  host_lattice: fcc
  supercell: [4, 4, 4]
  spotcheck_supercell: [6, 6, 6]
  cases: [vac_Ni, vac_Nb, sub_NbinNi, sub_NiinNb]

epitaxy:
  model: fcc001-cube-on-cube

materials_project:
  chemsys: Nb-Ni
